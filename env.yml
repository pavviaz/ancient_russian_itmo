# Conda/mamba environment skeleton. Resolve heavy ML pins with pip per agent_protocol.md §1.2.
name: birchbark
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core ML (install torch from CUDA index separately):
      # pip install "torch>=2.5,<2.7" torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
      - "transformers>=4.50.0"
      - accelerate
      - peft
      - bitsandbytes
      - trl
      - datasets
      - sentencepiece
      - einops
      - "diffusers>=0.32"
      - "huggingface_hub>=0.27"
      - safetensors
      - jiwer
      - rapidfuzz
      - Levenshtein
      - pandas
      - scikit-learn
      - matplotlib
      - seaborn
      - evaluate
      - wandb
      - tensorboard
      - hydra-core
      - omegaconf
      - rich
      - tqdm
      - orjson
      - beautifulsoup4
      - lxml
      - httpx
