[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birchbark-ocr"
version = "0.1.0"
description = "Birchbark manuscript OCR research pipeline (gramoty.ru + VLM fine-tuning)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "rich>=13.0",
    "tqdm>=4.66",
    "orjson>=3.10",
    "pandas>=2.2",
    "jiwer>=3.0",
    "matplotlib>=3.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]
torch = []  # Install PyTorch per agent_protocol.md (CUDA wheel index)
baselines = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
